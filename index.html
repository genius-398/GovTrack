<!doctype html>
<html lang="en">
  <head>
    <script>
      // Fix for sandboxed iframes where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var _currentFetch = originalFetch ? originalFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Ignore if already configurable
        }
      })();
    </script>
